<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; frame-src blob: data:; object-src 'self' blob:; form-action 'none';">
  <title>静读</title>
  <link rel="stylesheet" href="styles/reader.css">
</head>
<body>
  <header class="app-header" id="app-header">
    <div class="header-left">
      <button class="icon-button reader-only" id="sidebar-button" aria-label="打开目录" title="目录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="brand" id="home-button" title="返回书架">
        <span class="brand-mark">静</span>
        <span class="brand-name">静读</span>
      </button>
      <div class="book-heading reader-only">
        <span class="header-divider"></span>
        <span id="header-title">未命名书籍</span>
      </div>
    </div>
    <div class="header-actions">
      <span class="privacy-note welcome-only">文件仅保存在此浏览器中</span>
      <button class="soft-button" id="open-button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m-5-5 5 5 5-5M5 20h14"/></svg>
        打开书籍
      </button>
      <button class="icon-button reader-only" id="settings-button" aria-label="阅读设置" title="阅读设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.37a1.7 1.7 0 0 0-1 .63 1.7 1.7 0 0 0-.37 1.08V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.23 15a1.7 1.7 0 0 0-.63-1A1.7 1.7 0 0 0 2.52 13H2V9h.52A1.7 1.7 0 0 0 4.23 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.6 3.6a1.7 1.7 0 0 0 1-.63A1.7 1.7 0 0 0 10 1.9V2h4v-.09A1.7 1.7 0 0 0 15 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 8a1.7 1.7 0 0 0 .63 1 1.7 1.7 0 0 0 1.08.37H21v4h.09a1.7 1.7 0 0 0-1.69 1.63Z"/></svg>
      </button>
    </div>
  </header>

  <main id="welcome-view" class="welcome-view">
    <section class="hero" id="drop-zone">
      <div class="hero-art" aria-hidden="true">
        <div class="book book-back"></div><div class="book book-front"><span>静</span></div>
      </div>
      <p class="eyebrow">LOCAL-FIRST READER</p>
      <h1>把书交给浏览器，<br><em>把注意力留给阅读。</em></h1>
      <p class="hero-copy">打开 PDF、EPUB、MOBI 或 AZW3。无需上传，无需注册，阅读进度安静地留在本机。</p>
      <button class="primary-button" id="hero-open-button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z"/></svg>
        选择一本书
      </button>
      <p class="drop-hint">也可以直接拖到这里</p>
      <div class="format-row"><span>PDF</span><span>EPUB</span><span>MOBI</span><span>AZW3</span></div>
    </section>
    <section class="library-section" id="library-section" hidden>
      <div class="section-heading"><div><p class="eyebrow">YOUR LIBRARY</p><h2>最近阅读</h2></div><p>点击书籍，继续上次的位置</p></div>
      <div class="book-grid" id="book-grid"></div>
    </section>
  </main>

  <main id="reader-view" class="reader-view" hidden>
    <aside class="sidebar" id="sidebar" aria-label="书籍目录">
      <div class="sidebar-book">
        <div class="cover-placeholder" id="sidebar-cover"><span id="cover-letter">静</span></div>
        <div class="sidebar-meta"><strong id="sidebar-title">未命名书籍</strong><span id="sidebar-author">未知作者</span><small id="sidebar-format">EPUB</small></div>
      </div>
      <div class="sidebar-label"><span>目录</span><span id="toc-count"></span></div>
      <nav class="toc" id="toc"></nav>
    </aside>
    <div class="reader-stage" id="reader-stage">
      <div class="loading-view" id="loading-view">
        <div class="spinner"></div><strong>正在打开书籍</strong><span id="loading-detail">解析内容与目录…</span>
      </div>
      <div class="ebook-host" id="ebook-host"></div>
      <div class="pdf-viewport" id="pdf-viewport"><div class="pdf-pages" id="pdf-pages"></div></div>
      <button class="page-zone page-zone-left" id="prev-button" aria-label="上一页"><span>‹</span></button>
      <button class="page-zone page-zone-right" id="next-button" aria-label="下一页"><span>›</span></button>
    </div>
    <footer class="reader-footer">
      <span id="chapter-label">开始</span>
      <input id="progress-slider" type="range" min="0" max="1" step="any" value="0" aria-label="阅读进度">
      <span id="progress-label">0%</span>
    </footer>
  </main>

  <aside class="settings-panel" id="settings-panel" aria-label="阅读设置">
    <div class="panel-header"><div><p class="eyebrow">READING</p><h2>阅读设置</h2></div><button class="icon-button" id="close-settings" aria-label="关闭设置">×</button></div>
    <div class="setting-group ebook-setting">
      <label>阅读方式</label>
      <div class="segmented"><button data-flow="paginated" class="active">分页</button><button data-flow="scrolled">滚动</button></div>
    </div>
    <div class="setting-group ebook-setting"><label for="font-select">正文字体</label><select id="font-select"><option value="serif">宋体 / 衬线</option><option value="sans">黑体 / 无衬线</option><option value="system">系统字体</option></select></div>
    <div class="setting-group ebook-setting"><label for="font-size">字号 <output id="font-size-value">20</output></label><input id="font-size" type="range" min="14" max="32" value="20"></div>
    <div class="setting-group ebook-setting"><label for="line-height">行距 <output id="line-height-value">1.75</output></label><input id="line-height" type="range" min="1.3" max="2.2" step="0.05" value="1.75"></div>
    <div class="setting-group ebook-setting"><label for="page-width">栏宽 <output id="page-width-value">760</output></label><input id="page-width" type="range" min="520" max="1000" step="20" value="760"></div>
    <div class="setting-group"><label>页面主题</label><div class="theme-options"><button data-theme="paper" title="纸张" class="paper active"></button><button data-theme="light" title="明亮" class="light"></button><button data-theme="sepia" title="暖黄" class="sepia"></button><button data-theme="dark" title="深色" class="dark"></button></div></div>
    <p class="panel-tip" id="panel-tip">方向键翻页，Esc 收起面板</p>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status"></div>
  <input id="file-input" type="file" accept=".pdf,.epub,.mobi,.azw3,application/pdf,application/epub+zip,application/x-mobipocket-ebook" hidden>
  <script type="module" src="src/reader.js"></script>
</body>
</html>
